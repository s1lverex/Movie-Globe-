name: Deploy to Cloudflare Pages

# Builds, tests and deploys Travel Globe to the `travel-globe` Pages project.
# Needs two encrypted repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  – API token with "Cloudflare Pages: Edit" + "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID – your Cloudflare account ID
# Without them the deploy steps are skipped (the build/test still runs).
# App secrets such as RESEND_API_KEY live in the Pages project, never in git.

on:
  workflow_dispatch:
  push:
    branches: [main, claude/compassionate-curie-d0tkxm]

concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Deploy credentials missing — skipping deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys."

      - name: Apply D1 migrations (remote)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          # Look up the database id at runtime so no IDs are committed.
          DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const db=JSON.parse(s).find(d=>d.name==='travel-globe');if(!db)process.exit(1);process.stdout.write(db.uuid)})")
          sed -i "s/00000000-0000-0000-0000-000000000000/${DB_ID}/" wrangler.toml
          npx wrangler d1 migrations apply travel-globe --remote

      - name: Deploy to Pages (production)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler pages deploy dist --project-name travel-globe --branch main --commit-dirty=true
